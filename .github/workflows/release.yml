# O build que vai para o TestFlight (e, depois, para a App Store) sai daqui, de uma tag
# assinada pelo dono, e nao do Mac de ninguem (auditoria 4, R7-M3). Dispara so com o
# push de uma tag testflight-X.Y.Z-N ou vX.Y.Z-N, e cada job so roda se o anterior passou:
#
#   assinatura  a tag e anotada, assinada por uma chave de .github/assinantes, aponta
#               para um commit da main, e X.Y.Z e a versao do projeto.
#   verificar   o mesmo verificar.yml que confere a main, no commit da tag: o
#               verificador inteiro, os testes, o app em Release e o envelope.
#   montar      archive Release com o build N, sem segredo nenhum e sem o environment:
#               e o unico job que roda codigo do commit. Assina o archive ad hoc com os
#               entitlements do repositorio e o entrega num zip, com o SHA-256 na saida.
#   enviar      o unico job que ve segredo, e so comeca depois de o dono aprovar no
#               environment release. Nao roda nada do build: confere o zip pelo SHA-256,
#               recusa caminho de fora e link simbolico, confere bundle id e entitlements
#               antes do export, exporta o .ipa assinado pela nuvem da Apple, confere de
#               novo, faz SHA-256 e atestacao do .ipa e envia esse mesmo .ipa.
#
# Como assinar a tag, o que isto prova e o que nao prova: docs/release.md.
name: release

on:
  push:
    tags:
      - "testflight-*"
      - "v*"

permissions:
  contents: read

# Um release por vez, e nenhum cancelado no meio de um envio.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  assinatura:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versao: ${{ steps.tag.outputs.versao }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      # Acoes fixadas por commit, nunca por tag movel (o tools/verificar.sh confere).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O historico inteiro e a main: o commit da tag tem de estar nela.
          fetch-depth: 0

      # O nome da tag entra por variavel de ambiente, nunca colado no script.
      - id: tag
        name: Tag assinada pelo dono, num commit da main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Sem os objetos de troca (refs/replace): com eles, o cat-file, o tag -v e o merge-base leriam a lista, a tag e a
          # historia que alguem empurrasse no lugar (rodada 11 da auditoria 8).
          export GIT_NO_REPLACE_OBJECTS=1
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::o release so roda de tag"; exit 1; }
          # O checkout tem de ser o do commit da tag: os arquivos deste passo sao lidos da arvore (rodada 9 da auditoria 8).
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::checkout fora do commit da tag"; exit 1; }

          # testflight-X.Y.Z-N ou vX.Y.Z-N: N vira o CFBundleVersion.
          if [[ ! "$TAG" =~ ^(testflight-|v)([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]{0,5})$ ]]; then
            echo "::error::tag fora do formato testflight-X.Y.Z-N ou vX.Y.Z-N"
            exit 1
          fi
          versao="${BASH_REMATCH[2]}"
          build="${BASH_REMATCH[3]}"

          # A tag como esta no GitHub: o checkout pode ter trazido so o commit, sem o
          # objeto da tag, que e onde mora a assinatura. O repositorio e publico.
          git fetch --no-tags --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "::error::$TAG e uma tag leve, que nao carrega assinatura"
            exit 1
          fi
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::a tag aponta para $commit e o run e de $GITHUB_SHA"
            exit 1
          fi

          # A assinatura, contra o .github/assinantes do proprio commit. minTrustLevel
          # fully recusa chave fora do arquivo, e a linha "Good ... for <e-mail>" so sai
          # quando a chave esta nele. Sem nenhuma chave no arquivo, nada passa.
          # Lido do objeto do commit, e nao da arvore: um `git checkout <ref> -- .github/assinantes`
          # trocava a lista sem mudar o HEAD (rodada 10 da auditoria 8). O cat-file nunca passa por textconv.
          assinantes="$RUNNER_TEMP/assinantes"
          git cat-file blob "$GITHUB_SHA:.github/assinantes" > "$assinantes"
          if ! grep -qvE '^[[:space:]]*(#|$)' "$assinantes"; then
            echo "::error::.github/assinantes nao tem nenhuma chave: o dono cadastra a dele antes do primeiro release (docs/release.md)"
            exit 1
          fi
          # O programa que confere pelo caminho, na linha: ela vence o gitconfig que um passo anterior gravasse (rodada 12), e o do
          # x509 tambem, que um falso aceitava uma tag com "BEGIN SIGNED MESSAGE" (rodada 13).
          if saida=$(git -c gpg.ssh.program=/usr/bin/ssh-keygen -c gpg.program=/bin/false -c gpg.x509.program=/bin/false -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$assinantes" -c gpg.minTrustLevel=fully \
              tag -v "$TAG" 2>&1 >/dev/null) && grep -q '^Good "git" signature for ' <<<"$saida"; then
            grep '^Good "git" signature for ' <<<"$saida"
          else
            echo "$saida"
            echo "::error::a assinatura de $TAG nao e de uma chave de .github/assinantes"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::o commit $commit nao esta na main"
            exit 1
          fi

          # A versao da tag e a que o projeto declara, no project.yml e no projeto gerado
          # que o xcodebuild le.
          if ! grep -qF "MARKETING_VERSION: \"$versao\"" project.yml; then
            echo "::error::project.yml nao declara MARKETING_VERSION $versao"
            exit 1
          fi
          no_projeto=$(grep -oE 'MARKETING_VERSION = [^;]+;' EscaliburWallet.xcodeproj/project.pbxproj | sort -u)
          if [ "$no_projeto" != "MARKETING_VERSION = $versao;" ]; then
            echo "::error::o EscaliburWallet.xcodeproj diz $no_projeto, e a tag $versao"
            exit 1
          fi

          # Nenhum build vai para a loja, nem para o TestFlight, sem a lista assinada (pedido
          # do dono, 18/10/2026): o site/versoes.json do commit da tag traz esta versao com
          # este build. A assinatura da lista o job verificar confere (tools/verificar.sh,
          # versoes.swift conferir), e o site publica a lista quando o commit chega na main,
          # antes de o build chegar na loja.
          if ! python3 -I - "$versao" "$build" <<'PY'
          import json, sys
          versao, build = sys.argv[1], sys.argv[2]
          try:
              envelope = json.load(open("site/versoes.json", encoding="utf-8"))
              corpo = json.loads(envelope["manifesto"])
          except Exception as erro:
              sys.exit(f"site/versoes.json ausente ou ilegivel: {erro}")
          if not any(v.get("versao") == versao and build in v.get("builds", []) for v in corpo.get("versoes", [])):
              sys.exit(f"site/versoes.json nao autoriza a versao {versao} build {build}")
          PY
          then
            echo "::error::a lista assinada nao autoriza $versao ($build): rode swift tools/versoes/versoes.swift autorizar $versao $build <chave> e ponha o site/versoes.json na main antes da tag (docs/release.md)"
            exit 1
          fi

          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "$TAG: versao $versao, build $build, commit $commit"

  # O mesmo arquivo que confere a main e os PRs, sem copia: o que barra a main barra o
  # release.
  verificar:
    needs: assinatura
    permissions:
      contents: read
    uses: ./.github/workflows/verificar.yml

  # O build roda aqui, sem segredo nenhum e sem o environment: o codigo do commit (o projeto, o Kit, os scripts e os
  # plugins do SwiftPM) nunca roda no mesmo runner que a chave da App Store Connect. Antes os dois ficavam no mesmo job, e
  # um processo deixado em segundo plano por um passo do build lia o .p8 gravado depois (auditoria 8, 14/11/2026).
  montar:
    needs: [assinatura, verificar]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      digesto: ${{ steps.pacote.outputs.digesto }}
    env:
      VERSAO: ${{ needs.assinatura.outputs.versao }}
      BUILD: ${{ needs.assinatura.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode do .xcode-version, no commit da tag
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::checkout fora do commit da tag"; exit 1; }
          versao=$(sed 's/^Xcode //' .xcode-version)
          sudo xcode-select -s "/Applications/Xcode_${versao}.app"
          [ "$(xcodebuild -version | head -1)" = "$(cat .xcode-version)" ] || { echo "::error::Xcode diferente do .xcode-version"; exit 1; }
          xcodebuild -version

      # Sem certificado no runner. O archive sai sem assinatura, e o codesign poe nele uma
      # assinatura local (ad hoc) com os entitlements do repositorio, so para o export
      # saber o que o app pede; quem assina de verdade e o export, pela nuvem da Apple.
      # Com -allowProvisioningUpdates no archive, o Xcode criaria um certificado de
      # desenvolvimento novo a cada runner limpo, e o run seguinte pararia pedindo para
      # revogar o anterior.
      - name: Archive Release com o build da tag, sem nada do modo demo
        run: |
          set -euo pipefail
          arquivo="$RUNNER_TEMP/EscaliburWallet.xcarchive"
          arvore=$(git rev-parse 'HEAD^{tree}')
          # As flags do pacote avaliado e as que o compilador recebeu de fato, no log inteiro do archive (decima passada
          # da auditoria de 03/11/2026), como no tools/arquivar.sh.
          unset XCODE_XCCONFIG_FILE
          (cd Kit && swift package dump-package 2>/dev/null) | python3 -I tools/flags-do-pacote.py Kit/Package.swift \
            || { echo "::error::o Package.swift define uma flag do Swift que o verificador nao conhece"; exit 1; }
          xcodebuild -project EscaliburWallet.xcodeproj -scheme EscaliburWallet -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$arquivo" -derivedDataPath "$RUNNER_TEMP/dd" \
            CURRENT_PROJECT_VERSION="$BUILD" ESCALIBUR_COMMIT="$GITHUB_SHA" ESCALIBUR_TREE="$arvore" CODE_SIGNING_ALLOWED=NO archive \
            > "$RUNNER_TEMP/archive.log" 2> "$RUNNER_TEMP/archive-erros.log" \
            || { tail -40 "$RUNNER_TEMP/archive-erros.log" "$RUNNER_TEMP/archive.log"; echo "::error::o archive falhou"; exit 1; }
          ! grep -qE '(builtin-Swift|builtin-swift|/swiftc |/swift-frontend |/clang |/clang\+\+ )' "$RUNNER_TEMP/archive-erros.log" \
            || { echo "::error::uma chamada do compilador saiu na saida de erro do archive"; exit 1; }
          python3 -I tools/flags-do-build.py ios "$RUNNER_TEMP/archive.log" --build "$RUNNER_TEMP/dd" \
            || { echo "::error::o build passou ao Swift uma flag, um alvo ou um plugin que o verificador nao conhece"; exit 1; }
          app="$arquivo/Products/Applications/EscaliburWallet.app"
          for plist in "$app/Info.plist" "$app/PlugIns/EscaliburWidgets.appex/Info.plist"; do
            [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSAO" ] \
              && [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD" ] \
              || { echo "::error::$plist sem a versao $VERSAO ($BUILD)"; exit 1; }
          done
          [ "$(/usr/libexec/PlistBuddy -c 'Print :EscaliburCommit' "$app/Info.plist")" = "$GITHUB_SHA" ] \
            && [ "$(/usr/libexec/PlistBuddy -c 'Print :EscaliburTree' "$app/Info.plist")" = "$arvore" ] \
            || { echo "::error::o app nao leva o commit $GITHUB_SHA e a arvore $arvore"; exit 1; }
          swift tools/versoes/versoes.swift conferir-app "$app" \
            || { echo "::error::o app nao leva a lista assinada que autoriza $VERSAO ($BUILD)"; exit 1; }
          if strings "$app/EscaliburWallet" | grep -E "abandon abandon abandon|DebugDemo|envio-incerto|enviar-eth|-alarme-versao|-versao-expirada|-versao-obrigatoria|-tentou-atualizar"; then
            echo "::error::o binario de distribuicao carrega codigo do modo demo"
            exit 1
          fi
          codesign --force --sign - --timestamp=none \
            --entitlements App/EscaliburWidgets/EscaliburWidgets.entitlements "$app/PlugIns/EscaliburWidgets.appex"
          codesign --force --sign - --timestamp=none \
            --entitlements App/EscaliburWallet/Resources/EscaliburWallet.entitlements "$app"

      # O archive assinado ad hoc vai para o job do envio num zip, com o SHA-256 dito pela saida deste job: o do envio
      # confere antes de abrir.
      - id: pacote
        name: Empacotar o archive para o envio
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Sem atributo estendido, fork de recurso nem ACL: o zip so leva os arquivos, e o envio recusa o que nao for
          # EscaliburWallet.xcarchive/.
          ditto -c -k --norsrc --noextattr --noacl --keepParent EscaliburWallet.xcarchive archive.zip
          digesto=$(shasum -a 256 archive.zip | cut -d' ' -f1)
          [[ "$digesto" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::digesto do archive fora do formato"; exit 1; }
          echo "digesto=$digesto" >> "$GITHUB_OUTPUT"
          echo "archive: $digesto"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ github.ref_name }}
          path: ${{ runner.temp }}/archive.zip
          if-no-files-found: error
          retention-days: 1

  # O envio: so aqui existem os segredos (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8), no environment que pede a aprovacao do
  # dono e so aceita as tags testflight-* e v*. Nada do build roda aqui: do repositorio, so o ExportOptions.plist, o
  # .xcode-version e o conferidor de entitlements, num checkout esparso; o resto sao as ferramentas da Apple sobre o archive
  # que o job de cima montou e cujo SHA-256 ele disse.
  enviar:
    needs: [assinatura, montar]
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      # O certificado de curta duracao da Sigstore, para assinar a atestacao.
      id-token: write
      # Gravar a atestacao no repositorio.
      attestations: write
    env:
      VERSAO: ${{ needs.assinatura.outputs.versao }}
      BUILD: ${{ needs.assinatura.outputs.build }}
      DIGESTO: ${{ needs.montar.outputs.digesto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ExportOptions.plist
            .xcode-version
            tools/conferir-entitlements.py
            App/EscaliburWallet/Resources/EscaliburWallet.entitlements
            App/EscaliburWidgets/EscaliburWidgets.entitlements
          sparse-checkout-cone-mode: false

      - name: Xcode do .xcode-version, no commit da tag
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "::error::checkout fora do commit da tag"; exit 1; }
          versao=$(sed 's/^Xcode //' .xcode-version)
          sudo xcode-select -s "/Applications/Xcode_${versao}.app"
          [ "$(xcodebuild -version | head -1)" = "$(cat .xcode-version)" ] || { echo "::error::Xcode diferente do .xcode-version"; exit 1; }

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: archive-${{ github.ref_name }}
          path: ${{ runner.temp }}/entrada

      # O zip veio de um job que roda codigo do commit: antes do export, que ja usa a chave, so entra o que e do app.
      # Cada caminho dentro de EscaliburWallet.xcarchive/, nenhum link simbolico nem arquivo especial (um link podia
      # apontar o export para fora do archive), o bundle id do app e do widget, nenhum outro plugin ou framework, e a
      # assinatura ad hoc com os entitlements do repositorio e nada mais (rodada 1 da auditoria 8, 14/11/2026).
      - name: Conferir o archive pelo SHA-256 do job do build
        run: |
          set -euo pipefail
          [[ "$DIGESTO" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::o job do build nao disse o digesto"; exit 1; }
          cd "$RUNNER_TEMP"
          [ "$(shasum -a 256 entrada/archive.zip | cut -d' ' -f1)" = "$DIGESTO" ] || { echo "::error::o archive nao e o que o build montou"; exit 1; }
          # Antes de abrir: um link simbolico aberto pelo ditto deixaria a entrada seguinte gravar fora da pasta.
          python3 -I - entrada/archive.zip <<'PY'
          import stat, sys, zipfile
          ruins = []
          for info in zipfile.ZipFile(sys.argv[1]).infolist():
              nome, modo = info.filename, info.external_attr >> 16
              partes = nome.rstrip("/").split("/")
              if not nome.startswith("EscaliburWallet.xcarchive/") or ".." in partes or "\\" in nome or "\0" in nome:
                  ruins.append(f"caminho {nome!r}")
              elif info.create_system != 3 or not (stat.S_ISREG(modo) or stat.S_ISDIR(modo)):
                  ruins.append(f"tipo {oct(modo)} em {nome!r}")
          if ruins:
              sys.exit("o zip leva o que nao e arquivo do archive: " + "; ".join(ruins[:20]))
          PY
          mkdir archive
          ditto -x -k entrada/archive.zip archive
          if [ -n "$(find archive ! -type f ! -type d -print -quit)" ]; then
            find archive ! -type f ! -type d
            echo "::error::o archive leva link simbolico ou arquivo especial"
            exit 1
          fi
          app="$RUNNER_TEMP/archive/EscaliburWallet.xcarchive/Products/Applications/EscaliburWallet.app"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD" ] \
            && [ "$(/usr/libexec/PlistBuddy -c 'Print :EscaliburCommit' "$app/Info.plist")" = "$GITHUB_SHA" ] \
            || { echo "::error::o archive nao e do build $BUILD deste commit"; exit 1; }
          python3 -I "$GITHUB_WORKSPACE/tools/conferir-entitlements.py" --ad-hoc "$app"

      # A chave .p8 vive num arquivo 600, numa pasta sorteada do $HOME, so durante este passo
      # e o do envio, e sai no fim de cada um (e de novo no ultimo passo, se algo parar no
      # meio). Nada dela no log nem no ambiente dos processos filhos.
      - name: Exportar o .ipa, assinado pela nuvem da Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::ASC_KEY_ID fora do formato"; exit 1; }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::ASC_ISSUER_ID fora do formato"; exit 1; }
          # A chave fora do $RUNNER_TEMP, onde o archive foi aberto, e fora do ambiente dos processos filhos.
          umask 077
          pasta=$(mktemp -d "$HOME/.asc.XXXXXX")
          trap 'rm -rf "$pasta"' EXIT
          chave="$pasta/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$chave"
          unset ASC_KEY_P8
          chmod 600 "$chave"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/archive/EscaliburWallet.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$chave" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # O que vai para a Apple: assinatura de distribuicao da equipe, os entitlements do
      # repositorio e nada alem dos que a Apple poe (tools/conferir-entitlements.py), a
      # versao da tag, e de novo nada do modo demo.
      - name: Assinatura de distribuicao e entitlements do repositorio
        run: |
          set -euo pipefail
          saida="$RUNNER_TEMP/saida"
          nome="EscaliburWallet-$VERSAO-$BUILD.ipa"
          mkdir -p "$saida"
          mv "$RUNNER_TEMP/export/EscaliburWallet.ipa" "$saida/$nome"
          cd "$saida"
          unzip -q "$nome"
          app=Payload/EscaliburWallet.app
          for alvo in "$app" "$app/PlugIns/EscaliburWidgets.appex"; do
            info=$(codesign -dvv "$alvo" 2>&1)
            grep -qx 'TeamIdentifier=2UNWMDD93S' <<<"$info" && grep -q '^Authority=Apple Distribution: ' <<<"$info" \
              || { echo "$info"; echo "::error::$alvo sem a assinatura de distribuicao da equipe 2UNWMDD93S"; exit 1; }
            [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$alvo/Info.plist")" = "$BUILD" ] \
              || { echo "::error::$alvo saiu do export com outro build"; exit 1; }
          done
          codesign --verify --strict --deep "$app"
          python3 -I "$GITHUB_WORKSPACE/tools/conferir-entitlements.py" "$app"
          if strings "$app/EscaliburWallet" | grep -E "abandon abandon abandon|DebugDemo|envio-incerto|enviar-eth|-alarme-versao|-versao-expirada|-versao-obrigatoria|-tentou-atualizar"; then
            echo "::error::o binario de distribuicao carrega codigo do modo demo"
            exit 1
          fi

      # SHA256SUMS: o .ipa, o binario principal como vai no .ipa, e o mesmo binario sem a
      # assinatura (o que da para comparar com um build feito do codigo, docs/release.md).
      - name: SHA-256 do .ipa e do binario principal
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saida"
          nome="EscaliburWallet-$VERSAO-$BUILD.ipa"
          binario=Payload/EscaliburWallet.app/EscaliburWallet
          cp "$binario" EscaliburWallet.sem-assinatura
          codesign --remove-signature EscaliburWallet.sem-assinatura
          shasum -a 256 "$nome" "$binario" EscaliburWallet.sem-assinatura > SHA256SUMS
          {
            echo "Escalibur Wallet $VERSAO ($BUILD)"
            echo "tag: $GITHUB_REF_NAME"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "xcode: $(xcodebuild -version | paste -sd ' ' -)"
            echo "runner: ${ImageOS:-macos-26}, imagem ${ImageVersion:-desconhecida}"
          } > release.txt
          cat release.txt SHA256SUMS
          { echo '```'; cat release.txt; echo; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Uma atestacao para os tres digestos de SHA256SUMS, assinada pela Sigstore publica
      # com a identidade deste workflow, deste commit e desta tag. `gh attestation verify`
      # confere (docs/release.md).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/saida/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digestos-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/saida/SHA256SUMS
            ${{ runner.temp }}/saida/release.txt
          if-no-files-found: error
          retention-days: 90

      # O arquivo enviado e o mesmo que tem o digesto e a atestacao: confere antes.
      - name: Enviar ao App Store Connect o .ipa atestado
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saida"
          nome="EscaliburWallet-$VERSAO-$BUILD.ipa"
          grep -F "  $nome" SHA256SUMS | shasum -a 256 -c -
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::ASC_KEY_ID fora do formato"; exit 1; }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::ASC_ISSUER_ID fora do formato"; exit 1; }
          umask 077
          pasta=$(mktemp -d "$HOME/.asc.XXXXXX")
          trap 'rm -rf "$pasta"' EXIT
          chave="$pasta/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$chave"
          unset ASC_KEY_P8
          chmod 600 "$chave"
          xcrun altool --upload-package "$nome" \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" --p8-file-path "$chave"

      - name: Apagar a chave, se sobrou
        if: always()
        run: rm -rf "$HOME"/.asc.*
